<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBE9DD">
  <title>Book an appointment · Buff Beauty Bar</title>
  <meta name="description" content="Book a blowout, wax, nails, makeup, spray tan or permanent jewelry at Buff Beauty Bar, New Orleans.">
  <link rel="icon" href="assets/buff-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <button id="back" class="icon-btn left" aria-label="Back" hidden>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <a class="logo" href="https://buffbeautybar.com" aria-label="Buff Beauty Bar home">
        <img src="assets/buff-logo.png" alt="Buff Beauty Bar" width="581" height="576">
      </a>
      <a id="call" class="icon-btn right" href="tel:5045222833">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      </a>
    </header>

    <div id="progress" class="progress">
      <div class="progress-row"><span id="step-label"></span><span id="step-count"></span></div>
      <div class="progress-track"><div id="bar-fill" class="progress-fill"></div></div>
    </div>

    <main id="main" class="main" aria-live="polite"></main>

    <footer id="footer" class="foot">
      <div class="foot-info">
        <span id="foot-sub" class="muted sm"></span>
        <span id="foot-total" class="foot-total"></span>
      </div>
      <button id="next" class="btn-primary">Continue</button>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/vendor/supabase-2.117.2.js"></script>
  <script src="js/api.js"></script>
  <script src="js/api-live.js"></script>
  <script src="js/app.js"></script>
